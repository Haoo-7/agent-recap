<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="540" viewBox="0 0 1200 540"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">agent-recap</title>
  <desc id="hero-desc">For anyone running several AI coding agents on one machine: every substantive reply ends with two fixed lines, preceded by a --- divider — a 🏁 recap line saying what the turn did, and a ➡️ Next line saying what comes next. 32 harness targets, each written through its own native mechanism. The specimen below is the closing format the rules require.</desc>

  <rect width="1200" height="540" rx="18" fill="#0B0E14"/>

  <!-- top: title block -->
  <g id="hero-title-block">
    <text x="56" y="80" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" fill="#8B93A7">For anyone running several AI coding agents on one machine</text>

    <text x="56" y="146" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="66" font-weight="700" letter-spacing="-1" fill="#E6E9F0">agent-recap</text>
    <rect x="432" y="101" width="14" height="45" rx="2" fill="#7EE787"/>

    <text x="56" y="196" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" fill="#E6E9F0">Every reply ends with two lines: what the turn did, what comes next.</text>

    <text x="1144" y="116" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" fill="#8B93A7">32 targets · 1 command · 0 dependencies</text>
    <text x="1144" y="146" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#5C6577">v0.2.0 · MIT · Node.js standard library · no network</text>
  </g>

  <!-- middle: the required closing format -->
  <g id="hero-specimen">
    <rect x="56" y="238" width="1088" height="136" rx="12" fill="#11151F" stroke="#242B39"/>
    <text x="84" y="272" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" fill="#8B93A7">Every substantive reply ends like this</text>
    <text x="1116" y="272" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#5C6577">the required closing · any agent</text>
    <line x1="84" y1="288" x2="1116" y2="288" stroke="#242B39"/>

    <text x="84" y="302" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#8B93A7">---</text>
    <text x="84" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20"><tspan fill="#7EE787" font-weight="700">🏁 recap:</tspan><tspan fill="#E6E9F0"> Wired the recap convention into every agent.</tspan></text>
    <text x="84" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20"><tspan fill="#79C0FF" font-weight="700">➡️ Next:</tspan><tspan fill="#C6CEDD"> restart each agent, then run status to confirm coverage.</tspan><tspan fill="#7EE787">▌</tspan></text>
  </g>

  <!-- bottom: adapters -->
  <g id="hero-targets" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">
    <text x="56" y="412" fill="#7EE787">32 TARGETS</text>
    <g fill="#8B93A7">
      <text x="240" y="412">opencode · claude · codex · grok · kimi · gemini · dsh · pi · commandcode</text>
      <text x="240" y="440">qoder · cursor · antigravity · hermes · misaka · copilot · qwen · crush · amp</text>
      <text x="240" y="468">zed · devin · goose · windsurf · roo · kiro · cline · kilo · continue</text>
      <text x="240" y="496">workbuddy · trae · zcode · CodeBuddy · AGENTS.md</text>
    </g>
  </g>
</svg>
