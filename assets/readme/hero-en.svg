<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="430" viewBox="0 0 1200 430"
     role="img" aria-labelledby="hero-en-title hero-en-desc">
  <title id="hero-en-title">agent-recap</title>
  <desc id="hero-en-desc">For anyone running several AI coding agents on one machine: every substantive reply ends with two fixed lines — a recap line saying what the turn did, and a Next line saying what comes next. The specimen on the right is real output.</desc>

  <rect width="1200" height="430" rx="18" fill="#0B0E14"/>

  <!-- top: title block -->
  <g id="hero-en-title-block">
    <text x="56" y="80" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="19" fill="#8B93A7">For anyone running several AI coding agents on one machine</text>

    <text x="56" y="146" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="66" font-weight="700" letter-spacing="-1" fill="#E6E9F0">agent-recap</text>
    <rect x="432" y="101" width="14" height="45" rx="2" fill="#7EE787"/>

    <text x="56" y="196" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="25" fill="#E6E9F0">Every reply ends with two lines: what this turn did, what comes next.</text>

    <text x="1144" y="116" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="19" fill="#8B93A7">8 targets · 1 command · 0 dependencies</text>
    <text x="1144" y="146" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="17" fill="#5C6577">v0.1.0 · MIT · Node.js standard library · no network</text>
  </g>

  <!-- bottom: the real specimen -->
  <g id="hero-en-specimen">
    <rect x="56" y="238" width="1088" height="136" rx="12" fill="#11151F" stroke="#242B39"/>
    <text x="84" y="272" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="18" fill="#8B93A7">Every substantive reply closes like this</text>
    <text x="1116" y="272" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" fill="#5C6577">The closing the rules require · any agent</text>
    <line x1="84" y1="288" x2="1116" y2="288" stroke="#242B39"/>

    <text x="84" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20"><tspan fill="#7EE787">🏁 recap:</tspan><tspan fill="#E6E9F0"> Wired the recap convention into every agent on this machine.</tspan></text>
    <text x="84" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20"><tspan fill="#79C0FF">Next:</tspan><tspan fill="#C6CEDD"> restart each agent, then run status to confirm coverage.</tspan><tspan fill="#7EE787">▌</tspan></text>
  </g>

  <!-- footer: adapter list -->
  <text x="56" y="408" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#5C6577">opencode · claude · codex · grok · kimi · gemini · dsh · AGENTS.md</text>
</svg>
