<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="474" viewBox="0 0 1200 474"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">agent-recap</title>
  <desc id="hero-desc">For anyone running several AI coding agents on one machine: every substantive reply ends with two fixed lines — a 🏁 recap line saying what the turn did, and a Next line saying what comes next. 26 harness targets, 15 detected on this machine. The specimen on the right is real output.</desc>

  <rect width="1200" height="474" rx="18" fill="#0B0E14"/>

  <!-- top: title block -->
  <g id="hero-title-block">
    <text x="56" y="80" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" fill="#8B93A7">For anyone running several AI coding agents on one machine</text>

    <text x="56" y="146" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="66" font-weight="700" letter-spacing="-1" fill="#E6E9F0">agent-recap</text>
    <rect x="432" y="101" width="14" height="45" rx="2" fill="#7EE787"/>

    <text x="56" y="196" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" fill="#E6E9F0">Every reply ends with two lines: what the turn did, what comes next.</text>

    <text x="1144" y="116" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" fill="#8B93A7">26 targets · 1 command · 0 dependencies</text>
    <text x="1144" y="146" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#5C6577">v0.2.0 · MIT · Node.js standard library · no network</text>
  </g>

  <!-- middle: the real specimen -->
  <g id="hero-specimen">
    <rect x="56" y="238" width="1088" height="136" rx="12" fill="#11151F" stroke="#242B39"/>
    <text x="84" y="272" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" fill="#8B93A7">Every substantive reply ends like this</text>
    <text x="1116" y="272" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#5C6577">the required closing · any agent</text>
    <line x1="84" y1="288" x2="1116" y2="288" stroke="#242B39"/>

    <text x="84" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20"><tspan fill="#7EE787">🏁 recap:</tspan><tspan fill="#E6E9F0"> Wired the recap convention into every agent on this machine.</tspan></text>
    <text x="84" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20"><tspan fill="#79C0FF">Next:</tspan><tspan fill="#C6CEDD"> restart each agent, then run status to confirm coverage.</tspan><tspan fill="#7EE787">▌</tspan></text>
  </g>

  <!-- bottom: adapters, split by evidence tier -->
  <g id="hero-targets" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="56" y="412" font-size="16" fill="#5C6577"><tspan fill="#7EE787">ON THIS MACHINE</tspan>  opencode · claude · codex · grok · kimi · dsh · pi · commandcode · qoder · cursor · antigravity · hermes · misaka · AGENTS.md</text>
    <text x="56" y="444" font-size="16" fill="#5C6577"><tspan fill="#79C0FF">OFFICIAL DOCS</tspan>  gemini · copilot · qwen · crush · amp · zed · devin · goose · windsurf · roo · kiro</text>
  </g>
</svg>
