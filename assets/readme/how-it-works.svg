<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="660" viewBox="0 0 1200 660"
     role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">agent-recap 怎样落到每个 agent</title>
  <desc id="flow-desc">install 检测本机装了哪些 agent，按四种原生机制写入 26 个落点：在全局指令文件里维护 recap:begin 与 recap:end 标记区（21 个，含 ~/.agents/AGENTS.md 约定兜底）；写专用 rules 文件（Cursor 的 recap.mdc、Roo 和 Kiro 的 rules 目录）；通过 OpenCode 插件和 dsh profile patch 每次请求注入系统提示；未装的工具什么都不写。重跑 install 是原地更新，remove 整块撤除。</desc>

  <rect width="1200" height="660" rx="18" fill="#0B0E14"/>

  <text x="56" y="76" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="27" font-weight="700" fill="#E6E9F0">一条命令，四种原生机制，落到 26 个 harness</text>

  <!-- 命令条 -->
  <g id="flow-cmd">
    <rect x="56" y="104" width="1088" height="56" rx="10" fill="#11151F" stroke="#242B39"/>
    <text x="84" y="139" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20"><tspan fill="#7EE787">$</tspan><tspan fill="#E6E9F0"> node scripts/recap.mjs install</tspan></text>
    <text x="1116" y="139" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18" fill="#8B93A7">检测装了哪些 agent，按各自机制写入</text>
  </g>

  <!-- A：全局指令文件标记区 -->
  <g id="flow-family-md">
    <rect x="56" y="192" width="624" height="196" rx="10" fill="#11151F" stroke="#242B39"/>
    <circle cx="86" cy="222" r="5" fill="#79C0FF"/>
    <text x="104" y="228" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#E6E9F0">全局指令文件：维护一块 recap 标记区</text>
    <text x="656" y="228" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8B93A7">21 个落点</text>
    <line x1="80" y1="246" x2="656" y2="246" stroke="#242B39"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#C6CEDD">
      <text x="84" y="278">~/.claude/CLAUDE.md      ~/.codex/AGENTS.md</text>
      <text x="84" y="306">~/.pi/agent/AGENTS.md    ~/.qoder-cn/AGENTS.md</text>
      <text x="84" y="334">~/.hermes/SOUL.md        ~/.copilot/&#8203;copilot-instructions.md</text>
      <text x="84" y="362" fill="#8B93A7">+ ~/.agents/AGENTS.md 约定兜底 · 未装的工具不写</text>
    </g>
  </g>

  <!-- B：专用 rules 文件 -->
  <g id="flow-family-rules">
    <rect x="56" y="410" width="624" height="164" rx="10" fill="#11151F" stroke="#242B39"/>
    <circle cx="86" cy="440" r="5" fill="#79C0FF"/>
    <text x="104" y="446" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#E6E9F0">专用 rules 文件：一个本 Skill 自持的文件</text>
    <text x="656" y="446" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8B93A7">3 个落点</text>
    <line x1="80" y1="464" x2="656" y2="464" stroke="#242B39"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#C6CEDD">
      <text x="84" y="496">~/.cursor/rules/recap.mdc</text>
      <text x="84" y="524">~/.roo/rules/recap.md      ~/.kiro/steering/recap.md</text>
      <text x="84" y="552" fill="#8B93A7">Cursor 走 alwaysApply: true，不动你写的其他规则</text>
    </g>
  </g>

  <!-- C：代码级注入 -->
  <g id="flow-family-inject">
    <rect x="700" y="192" width="444" height="164" rx="10" fill="#11151F" stroke="#242B39"/>
    <circle cx="730" cy="222" r="5" fill="#7EE787"/>
    <text x="748" y="228" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#E6E9F0">代码级注入系统提示</text>
    <text x="1120" y="228" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8B93A7">2 个落点</text>
    <line x1="724" y1="246" x2="1120" y2="246" stroke="#242B39"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#C6CEDD">
      <text x="728" y="278">opencode  plugins/recap-line.js</text>
      <text x="728" y="306">dsh       profiles/*/cordis.patch.yml</text>
      <text x="728" y="334" fill="#8B93A7">每次请求注入，确定性最强</text>
    </g>
  </g>

  <!-- D：标记区标本 -->
  <g id="flow-block">
    <rect x="700" y="378" width="444" height="196" rx="10" fill="#11151F" stroke="#242B39"/>
    <text x="724" y="410" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#7EE787">&lt;!-- recap:begin --&gt;</text>
    <text x="724" y="436" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#C6CEDD">## Reply Closing (Recap)</text>
    <text x="724" y="462" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8B93A7">- 每条实质回复结尾一行</text>
    <text x="742" y="486" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8B93A7">&#8220;🏁 recap: &#8230;&#8221; + &#8220;Next: &#8230;&#8221;</text>
    <text x="724" y="512" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#7EE787">&lt;!-- recap:end --&gt;</text>
  </g>

  <!-- 证据档 -->
  <g id="flow-tiers" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="17" fill="#8B93A7">
    <text x="56" y="616" fill="#5C6577">证据档</text>
    <circle cx="148" cy="610" r="5" fill="#7EE787"/>
    <text x="164" y="616">local 14 个：路径读自本机代码</text>
    <circle cx="470" cy="610" r="5" fill="#79C0FF"/>
    <text x="486" y="616">docs 11 个：来自官方文档</text>
    <circle cx="742" cy="610" r="5" fill="#F0883E"/>
    <text x="758" y="616">待验证 1 个：需 --experimental</text>
    <text x="1144" y="616" text-anchor="end" fill="#E6E9F0">重跑 <tspan fill="#7EE787">install</tspan> 原地更新 · <tspan fill="#F0883E">remove</tspan> 整块撤除</text>
  </g>
</svg>
