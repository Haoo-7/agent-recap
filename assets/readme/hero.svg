<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">agent-recap</title>
  <desc id="hero-desc">让每个 AI coding agent 的回复结尾都带上一句 recap 交接和一行 Next 下一步；右侧是真实的回复结尾标本与安装命令。</desc>

  <defs>
    <linearGradient id="hero-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11151F"/>
      <stop offset="1" stop-color="#0B0E14"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="18" fill="#0B0E14"/>
  <rect x="56" y="44" width="568" height="1" fill="#262C3A"/>

  <!-- 左：类别、名称、价值 -->
  <g id="hero-title-block">
    <text x="56" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2" fill="#8B93A7">FOR EVERY AI CODING AGENT ON ONE MACHINE</text>

    <text x="56" y="146" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="60" font-weight="700" fill="#E6E9F0">agent-recap</text>
    <!-- 旗帜图标：项目 motif -->
    <g id="hero-flag" transform="translate(444 96)">
      <rect x="0" y="0" width="3" height="42" rx="1.5" fill="#8B93A7"/>
      <path d="M3 2 L46 12 L3 22 Z" fill="#7EE787"/>
    </g>

    <text x="56" y="204" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="26" fill="#E6E9F0">每条有实质内容的回复结尾，</text>
    <text x="56" y="240" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="26" fill="#E6E9F0">都有一句 recap 加一行 Next 交接。</text>
    <text x="56" y="278" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="20" fill="#8B93A7">一条命令装上，一条命令撤掉；重跑是原地更新，不会叠加。</text>

    <text x="56" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8B93A7">v0.1.0 · MIT · 纯 Node.js · 不联网</text>
  </g>

  <!-- 右：真实输出标本 -->
  <g id="hero-proof" transform="translate(672 48)">
    <rect width="472" height="284" rx="12" fill="url(#hero-fade)" stroke="#262C3A"/>
    <circle cx="24" cy="26" r="4" fill="#3D4453"/>
    <circle cx="40" cy="26" r="4" fill="#3D4453"/>
    <circle cx="56" cy="26" r="4" fill="#3D4453"/>
    <text x="80" y="31" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8B93A7">terminal</text>

    <text x="24" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#7EE787">$ npx skills add Haoo-7/agent-recap</text>
    <text x="24" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#5C6577">…</text>

    <g transform="translate(24 152)">
      <rect x="0" y="-9" width="3" height="14" rx="1.5" fill="#8B93A7"/>
      <path d="M3 -9 L25 -3.5 L3 2 Z" fill="#7EE787"/>
    </g>
    <text x="42" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#E6E9F0">recap: Wired the convention into</text>
    <text x="42" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#E6E9F0">every agent via its native mechanism.</text>

    <text x="24" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#79C0FF">Next: restart each agent, then</text>
    <text x="24" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#79C0FF">run status to confirm coverage.</text>

    <rect x="24" y="252" width="424" height="0" fill="none"/>
  </g>

  <!-- 底：标记区块 motif -->
  <text x="600" y="356" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#5C6577">&lt;!-- recap:begin --&gt;  一切改动都落在标记区块内  &lt;!-- recap:end --&gt;</text>
</svg>
