<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="660" viewBox="0 0 1200 660"
     role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">How agent-recap lands in each agent</title>
  <desc id="flow-desc">One install command detects which agents are present and writes through four native mechanisms across 26 targets: a recap:begin / recap:end marked region inside global instruction files (21 targets, including the ~/.agents/AGENTS.md convention fallback); one skill-owned rules file (Cursor recap.mdc, Roo and Kiro rules directories); system-prompt injection via the OpenCode plugin and dsh profile patch; and nothing at all for a tool that is not installed. Re-running install updates in place, remove strips the whole block.</desc>

  <rect width="1200" height="660" rx="18" fill="#0B0E14"/>

  <text x="56" y="76" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#E6E9F0">One command, four native mechanisms, 26 harness targets</text>

  <!-- command bar -->
  <g id="flow-cmd">
    <rect x="56" y="104" width="1088" height="56" rx="10" fill="#11151F" stroke="#242B39"/>
    <text x="84" y="139" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20"><tspan fill="#7EE787">$</tspan><tspan fill="#E6E9F0"> node scripts/recap.mjs install</tspan></text>
    <text x="1116" y="139" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" fill="#8B93A7">detects the agents present, writes each its own way</text>
  </g>

  <!-- A: marked region in global instruction files -->
  <g id="flow-family-md">
    <rect x="56" y="192" width="624" height="196" rx="10" fill="#11151F" stroke="#242B39"/>
    <circle cx="86" cy="222" r="5" fill="#79C0FF"/>
    <text x="104" y="228" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#E6E9F0">Global instruction file: one marked region</text>
    <text x="656" y="228" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8B93A7">21 targets</text>
    <line x1="80" y1="246" x2="656" y2="246" stroke="#242B39"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#C6CEDD">
      <text x="84" y="278">~/.claude/CLAUDE.md      ~/.codex/AGENTS.md</text>
      <text x="84" y="306">~/.pi/agent/AGENTS.md    ~/.qoder-cn/AGENTS.md</text>
      <text x="84" y="334">~/.hermes/SOUL.md    ~/.copilot/copilot-instructions.md</text>
      <text x="84" y="362" fill="#8B93A7">+ ~/.agents/AGENTS.md convention · nothing for absent tools</text>
    </g>
  </g>

  <!-- B: skill-owned rules files -->
  <g id="flow-family-rules">
    <rect x="56" y="410" width="624" height="164" rx="10" fill="#11151F" stroke="#242B39"/>
    <circle cx="86" cy="440" r="5" fill="#79C0FF"/>
    <text x="104" y="446" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#E6E9F0">Rules file the skill owns outright</text>
    <text x="656" y="446" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8B93A7">3 targets</text>
    <line x1="80" y1="464" x2="656" y2="464" stroke="#242B39"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#C6CEDD">
      <text x="84" y="496">~/.cursor/rules/recap.mdc</text>
      <text x="84" y="524">~/.roo/rules/recap.md      ~/.kiro/steering/recap.md</text>
      <text x="84" y="552" fill="#8B93A7">Cursor applies it via alwaysApply: true, beside your rules</text>
    </g>
  </g>

  <!-- C: system-prompt injection -->
  <g id="flow-family-inject">
    <rect x="700" y="192" width="444" height="164" rx="10" fill="#11151F" stroke="#242B39"/>
    <circle cx="730" cy="222" r="5" fill="#7EE787"/>
    <text x="748" y="228" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="700" fill="#E6E9F0">System-prompt injection</text>
    <text x="1120" y="228" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#8B93A7">2 targets</text>
    <line x1="724" y1="246" x2="1120" y2="246" stroke="#242B39"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#C6CEDD">
      <text x="728" y="278">opencode  plugins/recap-line.js</text>
      <text x="728" y="306">dsh       profiles/*/cordis.patch.yml</text>
      <text x="728" y="334" fill="#8B93A7">every request — the strongest tier</text>
    </g>
  </g>

  <!-- D: the marked block itself -->
  <g id="flow-block">
    <rect x="700" y="378" width="444" height="196" rx="10" fill="#11151F" stroke="#242B39"/>
    <text x="724" y="410" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#7EE787">&lt;!-- recap:begin --&gt;</text>
    <text x="724" y="436" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#C6CEDD">## Reply Closing (Recap)</text>
    <text x="724" y="462" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8B93A7">- one closing line per reply</text>
    <text x="742" y="486" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#8B93A7">&#8220;🏁 recap: &#8230;&#8221; + &#8220;➡️ Next: &#8230;&#8221;</text>
    <text x="724" y="512" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#7EE787">&lt;!-- recap:end --&gt;</text>
  </g>

  <!-- evidence tiers -->
  <g id="flow-tiers" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" fill="#8B93A7">
    <text x="56" y="612" fill="#5C6577">Evidence</text>
    <circle cx="155" cy="606" r="5" fill="#7EE787"/>
    <text x="171" y="612">local 14: verified against installed code</text>
    <circle cx="551" cy="606" r="5" fill="#79C0FF"/>
    <text x="567" y="612">docs 11: from official docs</text>
    <circle cx="820" cy="606" r="5" fill="#F0883E"/>
    <text x="836" y="612">unverified 1: opt-in</text>
    <text x="56" y="644" fill="#E6E9F0">re-run <tspan fill="#7EE787">install</tspan> updates in place · <tspan fill="#F0883E">remove</tspan> strips the whole block</text>
    <text x="1144" y="644" text-anchor="end" fill="#5C6577">home directory only · no network</text>
  </g>
</svg>
